<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Counter tablet: shown to customer</title>

</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B83A1C}a:hover{color:#8A2A12}
</style>
</helmet>
<div style="width: 1194px; height: 834px; box-sizing: border-box; background: #FFFFFF; color: #141414; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 36px 48px 40px; gap: 28px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <span style="font-size: 18px; font-weight: 600; color: #5E5E5E">Pharmacy says</span>
    <div style="display: flex; align-items: center; gap: 10px; padding: 8px 16px 8px 10px; border-radius: 24px; background: #FFF1EC">
      <svg width="30" height="20" viewBox="0 0 30 20" aria-hidden="true"><path d="M2 14 C 7 2, 11 2, 15 10 S 23 18, 28 6" fill="none" stroke="#FF5A36" stroke-width="4" stroke-linecap="round"></path></svg>
      <span style="font-size: 15px; font-weight: 700; color: #8A2A12">Deaf-friendly counter</span>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px">
    <div style="background: #FFF1EC; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; align-items: center; gap: 12px">
      <svg width="96" height="96" viewBox="0 0 48 48" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" role="img" aria-label="Tablet"><rect x="6" y="16" width="36" height="16" rx="8" transform="rotate(-30 24 24)"></rect><path d="M19 15 L29 33"></path></svg>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 64px; font-weight: 700; line-height: 1">1</span>
      <span style="font-size: 22px; color: #4A4A4A">tablet</span>
    </div>
    <div style="background: #FFF1EC; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; align-items: center; gap: 12px">
      <svg width="96" height="96" viewBox="0 0 48 48" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" role="img" aria-label="Times per day"><circle cx="24" cy="24" r="17"></circle><path d="M24 13 V24 L31 29"></path></svg>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 64px; font-weight: 700; line-height: 1">3×</span>
      <span style="font-size: 22px; color: #4A4A4A">max a day</span>
    </div>
    <div style="background: #FFF1EC; border-radius: 28px; padding: 28px; display: flex; flex-direction: column; align-items: center; gap: 12px">
      <svg width="96" height="96" viewBox="0 0 48 48" fill="none" stroke="#141414" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Price"><rect x="6" y="13" width="36" height="22" rx="4"></rect><circle cx="24" cy="24" r="5"></circle></svg>
      <span style="font-family: 'Space Grotesk', sans-serif; font-size: 64px; font-weight: 700; line-height: 1">€6.50</span>
      <span style="font-size: 22px; color: #4A4A4A">price</span>
    </div>
  </div>

  <p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 52px; font-weight: 700; line-height: 1.1">1 tablet. Up to 3 times a day. €6.50.</p>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; gap: 16px; align-items: center">
    <a href="Counter-Live.dc.html" style="flex-grow: 1; height: 72px; border-radius: 36px; background: #FF5A36; color: #141414; font-size: 24px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 12px">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2"></rect></svg>
      Sign your answer
    </a>
    <button style="height: 72px; padding: 0 28px; border-radius: 36px; border: 1px solid #D6D6D6; background: #FFFFFF; color: #141414; font: 600 20px Inter, sans-serif">Big text only</button>
    <button style="height: 72px; padding: 0 28px; border-radius: 36px; border: 1px dashed #B8B8B8; background: #FFFFFF; color: #4A4A4A; font: 600 20px Inter, sans-serif">DGS (later)</button>
  </div>
</div>
