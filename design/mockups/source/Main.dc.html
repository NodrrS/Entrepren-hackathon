<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signer phone: set up</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B83A1C}a:hover{color:#8A2A12}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #141414; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column; padding: 28px 24px 24px; gap: 22px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="display: flex; align-items: center; gap: 8px">
      <svg width="30" height="20" viewBox="0 0 30 20" aria-hidden="true"><path d="M2 14 C 7 2, 11 2, 15 10 S 23 18, 28 6" fill="none" stroke="#FF5A36" stroke-width="4" stroke-linecap="round"></path></svg>
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px">hands up</span>
    </div>
    <button aria-label="Settings" style="width: 44px; height: 44px; border-radius: 22px; border: 1px solid #E3E3E3; background: #FFFFFF; display: flex; align-items: center; justify-content: center">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="3"></circle><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"></path></svg>
    </button>
  </div>

  <div style="background: #FFF1EC; border-radius: 24px; height: 230px; display: flex; align-items: center; justify-content: center">
    <svg width="220" height="190" viewBox="0 0 220 190" role="img" aria-label="A phone standing upright on a counter, front camera facing the signer">
      <rect x="10" y="160" width="200" height="12" rx="4" fill="#141414"></rect>
      <rect x="72" y="20" width="76" height="132" rx="12" fill="#FFFFFF" stroke="#141414" stroke-width="4"></rect>
      <circle cx="110" cy="32" r="4" fill="#141414"></circle>
      <line x1="80" y1="86" x2="140" y2="86" stroke="#FF5A36" stroke-width="3" stroke-dasharray="5 4"></line>
      <path d="M92 152 L84 160 M128 152 L136 160" stroke="#141414" stroke-width="4" stroke-linecap="round"></path>
      <path d="M166 70 C 180 60, 192 64, 198 78" fill="none" stroke="#FF5A36" stroke-width="4" stroke-linecap="round"></path>
      <path d="M54 70 C 40 60, 28 64, 22 78" fill="none" stroke="#FF5A36" stroke-width="4" stroke-linecap="round"></path>
    </svg>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <h1 style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 32px; line-height: 1.1">Stand your phone on the counter</h1>
    <p style="margin: 0; font-size: 17px; line-height: 1.45; color: #4A4A4A">The staff don't need an app. They read the top half and speak their answer.</p>
  </div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 36px; height: 36px; border-radius: 18px; background: #141414; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">1</span>
      <span style="font-size: 17px">Front camera faces you</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 36px; height: 36px; border-radius: 18px; background: #141414; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">2</span>
      <span style="font-size: 17px">Sign. Words appear for the staff</span>
    </div>
    <div style="display: flex; align-items: center; gap: 14px">
      <span style="width: 36px; height: 36px; border-radius: 18px; background: #141414; color: #FFFFFF; font-weight: 700; display: flex; align-items: center; justify-content: center; flex-shrink: 0">3</span>
      <span style="font-size: 17px">Read the answer, your way</span>
    </div>
  </div>

  <div style="display: flex; gap: 8px; flex-wrap: wrap">
    <button style="min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #E3E3E3; background: #FFFFFF; font: 500 14px Inter, sans-serif; color: #141414">Reply: pictures + big text</button>
    <button style="min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #E3E3E3; background: #FFFFFF; font: 500 14px Inter, sans-serif; color: #141414">DGS → Deutsch</button>
  </div>

  <div style="flex-grow: 1"></div>

  <a href="Phone-Sign.dc.html" style="height: 64px; border-radius: 32px; background: #FF5A36; color: #141414; font-size: 22px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#141414" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M23 7l-7 5 7 5V7z"></path><rect x="1" y="5" width="15" height="14" rx="2"></rect></svg>
    Start
  </a>
  <p style="margin: 0; text-align: center; font-size: 13px; color: #5E5E5E">Nothing is recorded or uploaded.</p>
</div>
</x-dc>

return {};
}
}

</body>
</html>
