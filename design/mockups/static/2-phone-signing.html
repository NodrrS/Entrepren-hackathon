<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #141414; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">

    <div style="flex-grow: 1"></div>

      <button style="min-height: 44px; padding: 0 14px; border-radius: 22px; border: 1px solid #D6D6D6; background: #F5F5F5; font: 500 15px Inter, sans-serif; color: #141414">Price</button>
    </div>
    <a href="3-phone-reply.html" style="height: 56px; border-radius: 28px; background: #141414; color: #FFFFFF; font-size: 18px; font-weight: 600; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px">

    <div style="display: flex; justify-content: space-between; align-items: center; position: relative; z-index: 1">
      <span style="display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 600; color: #FFFFFF"><span style="width: 10px; height: 10px; border-radius: 5px; background: #FF5A36"></span>Reading your signs</span>
      <a href="1-phone-setup.html" style="min-height: 44px; padding: 0 16px; border-radius: 22px; background: #FFFFFF; color: #141414; font-size: 15px; font-weight: 600; text-decoration: none; display: flex; align-items: center">End</a>

    <svg width="300" height="300" viewBox="0 0 300 300" aria-hidden="true" style="position: absolute; left: 45px; top: 70px">

      <path d="M212 135 L 240 198 L 176 160" fill="none" stroke="#5FB6FF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"></path>

      <circle cx="164" cy="162" r="4" fill="#5FB6FF"></circle>

    <div style="position: relative; z-index: 1; display: flex; gap: 6px; flex-wrap: wrap">
      <span style="padding: 8px 12px; border-radius: 10px; background: #2E2E2E; color: #FFFFFF; font-size: 15px; font-weight: 600; letter-spacing: 0.04em">HALLO</span>

      <span style="padding: 8px 12px; border-radius: 10px; background: #FF5A36; color: #141414; font-size: 15px; font-weight: 700; letter-spacing: 0.04em">SCHMERZ</span>
