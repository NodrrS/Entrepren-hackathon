<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Signer phone: reply</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=Space+Grotesk:wght@500;700&amp;display=swap">
<style>
body{margin:0}
a{color:#B83A1C}a:hover{color:#8A2A12}
</style>
</head>
<body>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; color: #141414; font-family: Inter, system-ui, sans-serif; display: flex; flex-direction: column">

  <div style="height: 250px; box-sizing: border-box; padding: 22px; transform: rotate(180deg); display: flex; flex-direction: column; gap: 12px; background: #F5F5F5">
    <span style="font-size: 13px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: #5E5E5E">You said · shown to customer</span>
    <p style="margin: 0; font-size: 20px; line-height: 1.35; font-weight: 500">"This one is €6.50. Take one tablet up to three times a day."</p>
    <div style="flex-grow: 1"></div>
    <div style="display: flex; gap: 8px">
      <button style="flex-grow: 1; min-height: 48px; border-radius: 24px; border: none; background: #141414; color: #FFFFFF; font: 600 16px Inter, sans-serif">Speak again</button>
      <button style="min-height: 48px; padding: 0 16px; border-radius: 24px; border: 1px solid #D6D6D6; background: #FFFFFF; color: #141414; font: 600 16px Inter, sans-serif">Type</button>
    </div>
  </div>

  <div style="height: 2px; background: #FF5A36"></div>

  <div style="flex-grow: 1; box-sizing: border-box; padding: 22px 22px 24px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; align-items: center; justify-content: space-between">
      <span style="font-size: 14px; font-weight: 600; color: #5E5E5E">Pharmacy says</span>
      <span style="font-size: 13px; font-weight: 600; padding: 6px 12px; border-radius: 14px; background: #FFF1EC; color: #8A2A12">Pictures + simple text</span>
    </div>

    
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px">
        <div style="background: #FFF1EC; border-radius: 18px; padding: 16px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px">
          <svg width="52" height="52" viewBox="0 0 48 48" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" role="img" aria-label="Tablet"><rect x="6" y="16" width="36" height="16" rx="8" transform="rotate(-30 24 24)"></rect><path d="M19 15 L29 33"></path></svg>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700">1</span>
          <span style="font-size: 14px; color: #4A4A4A">tablet</span>
        </div>
        <div style="background: #FFF1EC; border-radius: 18px; padding: 16px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px">
          <svg width="52" height="52" viewBox="0 0 48 48" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" role="img" aria-label="Times per day"><circle cx="24" cy="24" r="17"></circle><path d="M24 13 V24 L31 29"></path></svg>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700">3×</span>
          <span style="font-size: 14px; color: #4A4A4A">max a day</span>
        </div>
        <div style="background: #FFF1EC; border-radius: 18px; padding: 16px 8px; display: flex; flex-direction: column; align-items: center; gap: 8px">
          <svg width="52" height="52" viewBox="0 0 48 48" fill="none" stroke="#141414" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Price"><rect x="6" y="13" width="36" height="22" rx="4"></rect><circle cx="24" cy="24" r="5"></circle></svg>
          <span style="font-family: 'Space Grotesk', sans-serif; font-size: 30px; font-weight: 700">€6.50</span>
          <span style="font-size: 14px; color: #4A4A4A">price</span>
        </div>
      </div>
      <p style="margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 26px; font-weight: 700; line-height: 1.2">1 tablet. Up to 3 times a day. €6.50.</p>
    

    

    <div style="flex-grow: 1"></div>

    <div style="display: flex; flex-direction: column; gap: 10px">
      <button style="min-height: 48px; border-radius: 24px; border: 1px dashed #B8B8B8; background: #FFFFFF; color: #4A4A4A; font: 600 15px Inter, sans-serif; display: flex; align-items: center; justify-content: center; gap: 8px">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#4A4A4A" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="6" r="3"></circle><path d="M12 9v6M7 12l5 3 5-3M9 22l3-7 3 7"></path></svg>
        Show in DGS (coming later)
      </button>
      <div style="display: flex; gap: 10px">
        <a href="2-phone-signing.html" style="flex-grow: 1; height: 60px; border-radius: 30px; background: #FF5A36; color: #141414; font-size: 19px; font-weight: 700; text-decoration: none; display: flex; align-items: center; justify-content: center">Sign answer</a>
        <button style="height: 60px; padding: 0 20px; border-radius: 30px; border: 1px solid #D6D6D6; background: #FFFFFF; color: #141414; font: 600 16px Inter, sans-serif">Bigger</button>
      </div>
    </div>
  </div>
</div>
</body>
</html>
